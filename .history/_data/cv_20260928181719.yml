  sections:
    Research Interests:
      - >-
        I am a PhD candidate in computational cognitive science expecting to graduate in early
        2027. My doctoral research lies at the intersection of early language acquisition, speech
        perception, machine learning, and auditory neuroscience. More specifically, I conduct
        computational simulations of early phonetic learning in fetuses and newborns. Although I
        have mainly used computational methods in my recent work, I would like to return to
        empirical research in my next position.

